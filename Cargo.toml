[package]
name = "embedded-matrix"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
authors = ["Jorge Andre Castro <georgeandrec@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "2x2 and 3x3 f32 matrices for no_std embedded systems, with no default dependencies"
repository = "https://github.com/jorgeandrecastro/embedded-matrix"
documentation = "https://docs.rs/embedded-matrix"
readme = "README.md"
keywords = ["matrix", "linear-algebra", "no-std", "embedded", "f32"]
categories = ["mathematics", "no-std", "embedded"]

[features]
default = []
# Rotation constructors (Matrix2x2::rotation, Matrix3x3::rotation_x/y/z).
trig = ["dep:embedded-trig-f32"]

[dependencies]
embedded-trig-f32 = { version = "0.4", optional = true }

[package.metadata.docs.rs]
all-features = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true